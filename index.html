<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Juanito Laguna AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- AR.js (versión estable actual) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs>
    <!-- Luz ambiental y direccional -->
    <a-entity light="type: ambient; intensity: 1"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="0 1 1"></a-entity>

    <!-- Marcadores -->
    <!-- Barrilete Maxi -->
    <a-marker type="pattern" url="barrilete.patt">
      <a-entity gltf-model="barrilete.glb" position="0 -1 0" rotation="0 180 0" scale="3 3 3"></a-entity>
      <!-- Sonido -->
      <a-sound id="sound" src="barrilete.mp3" autoplay="false" position="0 0 0">
      </a-sound>
    </a-marker>

    <a-marker type="pattern" url="caja.patt">
      <!-- Caja Santi -->
      <a-entity gltf-model="caja.glb" position="0 0 0" rotation="0 -90 0" scale="40 40 40">
      </a-entity>
    </a-marker>

    <!-- Barrilete Valen -->
    <a-marker type="pattern" url="barrileteVal.patt">
      <a-entity gltf-model="barrileteVal.glb" position="0 0 0" rotation="0 0 0" scale="30 30 30"></a-entity>
    </a-marker>

    <!-- Cámara -->
    <a-entity camera></a-entity>
  </a-scene>
</body>

</html>
