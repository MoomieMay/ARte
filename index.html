<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Prueba AR - Lápiz y Sol</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <!-- Marcador 1: Lápiz -->
      <a-marker type="pattern" url="public/lapiz.patt">
        <a-entity 
          gltf-model="url(public/lapiz.glb)" 
          scale="0.5 0.5 0.5"
          position="0 0 0"
          rotation="0 0 0"
          animation="property: rotation; to:0 360 0; loop:true; dur:8000">
        </a-entity>
      </a-marker>

      <!-- Marcador 2: Sol -->
      <a-marker type="pattern" url="public/sol.patt">
        <a-entity 
          gltf-model="url(public/sol.glb)" 
          scale="0.5 0.5 0.5"
          position="0 0 0"
          rotation="0 0 0"
          animation="property: rotation; to:0 360 0; loop:true; dur:8000">
        </a-entity>
      </a-marker>

      <!-- Cámara -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
